# Curated example queries (design doc §4.4). Giving the model 10-15 verified
# example queries dramatically improves generation accuracy versus schema alone.

- id: failed-orders-in-window
  title: Failed orders in a time window
  kind: sql
  query: |
    SELECT id, user_id, status, error_code, created_at
    FROM public.orders
    WHERE created_at BETWEEN :start AND :end AND status = 'FAILED'
    ORDER BY created_at DESC LIMIT 100;
  notes: The standard starting point for "checkout failed around <time>" tickets.

- id: orders-by-user-and-date
  title: A user's orders on a given day
  kind: sql
  query: |
    SELECT id, status, error_code, amount_cents, created_at
    FROM public.orders
    WHERE user_id = :user_id AND created_at::date = :day
    ORDER BY created_at DESC;
  notes: Use with db_search_by_identifier(user_id, "user_id") to find the user_id first.

- id: payments-by-provider-error
  title: Failed payments by provider
  kind: sql
  query: |
    SELECT id, order_id, provider, status, provider_ref, created_at
    FROM public.payments
    WHERE status = 'FAILED' AND created_at BETWEEN :start AND :end
    ORDER BY created_at DESC LIMIT 100;

- id: order-payment-join
  title: Order joined with its payment attempts
  kind: sql
  query: |
    SELECT o.id AS order_id, o.status AS order_status, o.error_code,
           p.id AS payment_id, p.provider, p.status AS payment_status, p.provider_ref
    FROM public.orders o
    LEFT JOIN public.payments p ON p.order_id = o.id
    WHERE o.id = :order_id;
  notes: Use once db_search_by_identifier has located the order id.

- id: audit-events-for-entity
  title: Audit trail for a specific entity
  kind: sql
  query: |
    SELECT event_type, payload, created_at
    FROM public.audit_events
    WHERE entity_type = :entity_type AND entity_id = :entity_id
    ORDER BY created_at ASC;
  notes: entity_type is typically 'order', 'payment', or 'user'.

- id: order-status-breakdown
  title: Order status counts in a window
  kind: sql
  query: |
    SELECT status, count(*) AS order_count
    FROM public.orders
    WHERE created_at BETWEEN :start AND :end
    GROUP BY status
    ORDER BY order_count DESC;
  notes: Useful for spotting an anomaly before drilling into individual orders.

- id: users-with-failed-orders
  title: Users who had a failed order in a window
  kind: sql
  query: |
    SELECT DISTINCT u.id, u.email, u.name
    FROM public.users u
    JOIN public.orders o ON o.user_id = u.id
    WHERE o.status = 'FAILED' AND o.created_at BETWEEN :start AND :end;
  notes: Results are PII-masked automatically by the server's redaction layer.

- id: order-by-request-id
  title: Find an order by its request/correlation id
  kind: sql
  query: |
    SELECT id, user_id, status, error_code, created_at
    FROM public.orders
    WHERE request_id = :request_id;
  notes: request_id is the field that should also appear in application logs — the basis for manual DB/log correlation.

- id: payments-failed-count-by-provider
  title: Failed payment counts grouped by provider
  kind: sql
  query: |
    SELECT provider, count(*) AS failures
    FROM public.payments
    WHERE status = 'FAILED' AND created_at BETWEEN :start AND :end
    GROUP BY provider
    ORDER BY failures DESC;
  notes: Good first query when a client reports "payments failed" without specifics.

- id: logs-trace-by-order-id
  title: "Logs Insights: trace all log lines for an order id"
  kind: logs_insights
  query: |
    fields @timestamp, @message
    | filter order_id = "88213"
    | sort @timestamp asc
    | limit 200
  notes: Replace the literal order id. Run once per relevant service log group.

- id: logs-error-rate-by-bin
  title: "Logs Insights: error rate over time by error code"
  kind: logs_insights
  query: |
    filter level = "ERROR"
    | stats count() as errors by bin(5m), error_code
    | sort errors desc
  notes: Use to spot a spike and narrow the time window before tracing individual requests.

- id: logs-latency-percentiles
  title: "Logs Insights: p95 latency over time"
  kind: logs_insights
  query: |
    filter ispresent(@duration)
    | stats pct(@duration, 95) as p95_ms, pct(@duration, 50) as p50_ms by bin(5m)
    | sort bin(5m) asc
  notes: Pairs well with cw_get_metric_stats on the same window to confirm infra-level correlation.

- id: logs-filter-by-correlation-id
  title: "Logs Insights: filter by an arbitrary correlation/request id"
  kind: logs_insights
  query: |
    fields @timestamp, level, service, @message
    | filter request_id = "req-9f2c1a2b3c4d"
    | sort @timestamp asc
    | limit 200
  notes: request_id should match the orders.request_id column for cross-source correlation.

- id: logs-top-error-messages
  title: "Logs Insights: most frequent error messages"
  kind: logs_insights
  query: |
    filter level = "ERROR"
    | stats count() as occurrences by @message
    | sort occurrences desc
    | limit 20
  notes: Good for spotting one dominant failure mode versus many unrelated errors.

- id: nrql-last-n-logs
  title: "NRQL: most recent log lines"
  kind: nrql
  query: |
    SELECT timestamp, message FROM Log SINCE 1 hour ago LIMIT 10
  notes: The basic sanity-check query — run this first to confirm nr_run_nrql_query is wired up before writing anything more specific.

- id: nrql-trace-by-order-id
  title: "NRQL: trace log lines for an order id"
  kind: nrql
  query: |
    SELECT timestamp, message FROM Log WHERE order_id = '88213' SINCE 1 day ago LIMIT 200
  notes: Assumes order_id was ingested as a parsed log attribute, not just embedded in the raw message text. If this returns nothing, fall back to `WHERE message LIKE '%88213%'`.

- id: nrql-filter-by-correlation-id
  title: "NRQL: filter by an arbitrary correlation/request id"
  kind: nrql
  query: |
    SELECT timestamp, level, service, message FROM Log WHERE request_id = 'req-9f2c1a2b3c4d' SINCE 1 day ago LIMIT 200
  notes: request_id should match the orders.request_id column for cross-source correlation.

- id: nrql-error-rate-by-time
  title: "NRQL: error rate over time by error code"
  kind: nrql
  query: |
    SELECT count(*) FROM Log WHERE level = 'ERROR' FACET error_code TIMESERIES 5 minutes SINCE 3 hours ago
  notes: Use to spot a spike and narrow the time window before tracing individual requests.

- id: nrql-top-error-messages
  title: "NRQL: most frequent error messages"
  kind: nrql
  query: |
    SELECT count(*) FROM Log WHERE level = 'ERROR' FACET message SINCE 1 day ago LIMIT 20
  notes: Good for spotting one dominant failure mode versus many unrelated errors.
