<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Indigo to Slate Navy -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.08" />
    </linearGradient>

    <!-- Glass Interior Gradient -->
    <radialGradient id="lensInterior" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92" />
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="1" />
    </radialGradient>

    <!-- Magnifying Glass Rim Gradient: Electric Blue to Indigo -->
    <linearGradient id="rimGradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Teal Accent Gradient (Monitoring / Telemetry) -->
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Electric Blue Gradient (Logs) -->
    <linearGradient id="blueLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Indigo Gradient (Database) -->
    <linearGradient id="indigoLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glow Filter for Teal Accent -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background: Rounded App Icon Squircle (Centered 512x512 with generous padding) -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGradient)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#borderGradient)" stroke-width="2.5" />

  <!-- Background Subtle Ambient Glow behind Magnifier -->
  <circle cx="216" cy="216" r="120" fill="#2563EB" opacity="0.12" />

  <!-- Magnifying Glass Group -->
  <g id="magnifying-glass">
    <!-- Handle (Extending down-right at 45°) -->
    <path d="M 288 288 L 376 376" 
          stroke="url(#handleGradient)" 
          stroke-width="32" 
          stroke-linecap="round" />
    <!-- Handle End Cap Accent -->
    <line x1="344" y1="344" x2="376" y2="376" 
          stroke="#1E1B4B" 
          stroke-width="32" 
          stroke-linecap="round" 
          opacity="0.6" />

    <!-- Lens Outer Rim (Bold, high-contrast, scalable to 64x64) -->
    <circle cx="216" cy="216" r="116" 
            fill="url(#lensInterior)" 
            stroke="url(#rimGradient)" 
            stroke-width="20" />

    <!-- Subtle Glare / Reflection on Upper Lens Arc -->
    <path d="M 124 216 A 92 92 0 0 1 278 126" 
          fill="none" 
          stroke="url(#glareGrad)" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- ================================================================= -->
    <!-- Central Iconography: Three Stacked Layers (Database, Logs, Metrics) -->
    <!-- Engineered for bold legibility at 64x64 and crisp elegance at 512 -->
    <!-- ================================================================= -->
    <g id="data-layers" transform="translate(216, 214)">

      <!-- Connection Bus / Spine connecting the 3 tiers -->
      <line x1="0" y1="-44" x2="0" y2="44" 
            stroke="#38BDF8" 
            stroke-width="4" 
            stroke-dasharray="3 3" 
            opacity="0.4" />

      <!-- LAYER 3 (BOTTOM): Database Platter (Indigo) -->
      <path d="M -54 38 C -54 48, 54 48, 54 38 L 54 48 C 54 58, -54 58, -54 48 Z" 
            fill="#3730A3" />
      <ellipse cx="0" cy="38" rx="54" ry="16" 
               fill="url(#indigoLayer)" />
      <ellipse cx="0" cy="38" rx="20" ry="6" 
               fill="#1E1B4B" 
               opacity="0.45" />

      <!-- LAYER 2 (MIDDLE): Logs & Traces Tier (Electric Blue) -->
      <path d="M -48 -2 C -48 8, 48 8, 48 -2 L 48 6 C 48 16, -48 16, -48 6 Z" 
            fill="#1D4ED8" />
      <ellipse cx="0" cy="-2" rx="48" ry="14" 
               fill="url(#blueLayer)" />
      <path d="M -22 -2 L 22 -2" 
            stroke="#93C5FD" 
            stroke-width="3" 
            stroke-linecap="round" 
            opacity="0.75" />

      <!-- LAYER 1 (TOP): Monitoring & Telemetry (Teal Accent) -->
      <path d="M -40 -44 C -40 -34, 40 -34, 40 -44 L 40 -37 C 40 -27, -40 -27, -40 -37 Z" 
            fill="#0F766E" />
      <ellipse cx="0" cy="-44" rx="40" ry="12" 
               fill="url(#tealAccent)" 
               filter="url(#tealGlow)" />
      
      <!-- Real-time pulse / metric node indicator in Teal -->
      <circle cx="0" cy="-44" r="5" fill="#F0FDFA" />

      <!-- Telemetry signal beacon rings -->
      <ellipse cx="0" cy="-44" rx="18" ry="5.5" 
               fill="none" 
               stroke="#CCFBF1" 
               stroke-width="1.8" 
               opacity="0.8" />
    </g>
  </g>
</svg>
