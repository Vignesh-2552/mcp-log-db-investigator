[project]
name = "opsinsight-mcp"
version = "0.1.1"
description = "Read-only MCP server for support ticket investigation across PostgreSQL, AWS CloudWatch and New Relic"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "fastmcp", "observability", "cloudwatch", "new-relic", "postgresql", "support"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=3.4.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sqlglot>=30.0",
    "boto3>=1.43",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
    "cachetools>=7.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Vignesh-2552/mcp-log-db-investigator"
Repository = "https://github.com/Vignesh-2552/mcp-log-db-investigator"
Issues = "https://github.com/Vignesh-2552/mcp-log-db-investigator/issues"
Changelog = "https://github.com/Vignesh-2552/mcp-log-db-investigator/blob/main/CHANGELOG.md"

[project.scripts]
investigation-server = "opsinsight.server:main"
opsinsight-mcp = "opsinsight.server:main_stdio"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsinsight"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/opsinsight", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
markers = [
    "integration: requires external services (e.g. docker-compose Postgres)",
]
asyncio_mode = "auto"
