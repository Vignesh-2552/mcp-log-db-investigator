[project]
name = "mcp-tool"
version = "0.1.0"
description = "MCP server for read-only log & database investigation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "sqlglot>=30.0",
    "boto3>=1.43",
    "pydantic-settings>=2.15",
    "cachetools>=7.0",
    "pyyaml>=6.0",
]

[project.scripts]
investigation-server = "investigation_server.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigation_server"]

[tool.pytest.ini_options]
markers = [
    "integration: requires external services (e.g. docker-compose Postgres)",
]
