name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: appdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -m "not integration" -q --cov=opsinsight --cov-report=term

      - name: Seed integration database
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d appdb -v ON_ERROR_STOP=1 -f .github/ci/seed.sql

      - name: Integration tests
        env:
          DB_URL: postgresql+asyncpg://ci:ci@localhost:5432/appdb
          # Fail instead of skipping if the service database isn't reachable.
          RUN_INTEGRATION_TESTS: "1"
        run: uv run pytest -m integration -q

  docker-build:
    # Only build once lint and every test have passed; a failure there fails the whole run.
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t investigation-mcp .
