version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python minor upgrades (3.13 -> 3.14/3.15) are manual. The slim image has
      # no compiler on purpose, so `uv sync` fails until every locked native dep
      # (pydantic-core, ...) ships wheels for the new version. Bump the base
      # image together with CI's `uv python install` and the lockfile (see #20).
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
